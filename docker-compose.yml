services:
  web:
    build: .
    image: daily-briefing
    container_name: daily-briefing
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      # 取自同目录的 .env；留空则 /api/daily 保持关闭（503）
      DAILY_API_TOKEN: ${DAILY_API_TOKEN:-}
    volumes:
      # 日报目录挂到宿主机：推送接口写入这里，页面下次请求就能读到，
      # 既不用重建镜像，内容也不会随容器重建而丢失。
      #
      # 容器内以 uid 1001 运行，宿主机目录需要对它可写，首次部署执行：
      #   sudo chown -R 1001:1001 ./content
      - ./content:/app/content
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
